name: CronVault — Backend Deploy via Jump Host

on:
  push:
    branches: [main]
    paths:
      - 'app.py'
      - 'Dockerfile'
      - 'docker-compose.yml'
  
  workflow_dispatch:   # <-- Allows manual trigger

jobs:
  deploy-backend:
    runs-on: ubuntu-latest
    env:
      JUMP_HOST: ubuntu@${{ secrets.FE_PUBLIC_IP }}
      BACKEND_HOST: ubuntu@${{ secrets.BE_PRIVATE_IP }}
      REMOTE_PATH: ~/cronvault

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup SSH key
        env:
          KEY: ${{ secrets.SSH_KEY_PEM }}
        run: |
          echo "$KEY" > /tmp/ssh_key && chmod 600 /tmp/ssh_key
          mkdir -p ~/.ssh
          ssh-keyscan -H ${{ secrets.FE_PUBLIC_IP }} >> ~/.ssh/known_hosts
          ssh -i /tmp/ssh_key -o StrictHostKeyChecking=no $JUMP_HOST \
            "ssh-keyscan -H ${{ secrets.BE_PRIVATE_IP }} >> ~/.ssh/known_hosts" 2>/dev/null || true

      - name: Backup current backend
        run: |
          TIMESTAMP=$(date +%Y%m%d-%H%M%S)
          BACKUP_PATH="${REMOTE_PATH}.backup.${TIMESTAMP}"
          echo "BACKUP_PATH=$BACKUP_PATH" >> $GITHUB_ENV

          ssh -i /tmp/ssh_key -o StrictHostKeyChecking=no -J $JUMP_HOST $BACKEND_HOST \
            "cp -r $REMOTE_PATH $BACKUP_PATH 2>/dev/null || echo 'No existing folder to backup'"

      - name: Ensure target directory exists
        run: |
          ssh -i /tmp/ssh_key -o StrictHostKeyChecking=no -J $JUMP_HOST $BACKEND_HOST \
            "mkdir -p $REMOTE_PATH"

      - name: Deploy backend files via jump host
        run: |
          scp -i /tmp/ssh_key -o StrictHostKeyChecking=no -J $JUMP_HOST \
            app.py Dockerfile docker-compose.yml \
            $BACKEND_HOST:$REMOTE_PATH/

      - name: Restart backend container
        run: |
          ssh -i /tmp/ssh_key -o StrictHostKeyChecking=no -J $JUMP_HOST $BACKEND_HOST \
            "cd $REMOTE_PATH && docker compose down && docker compose up -d --build"

      - name: Verify backend health
        run: |
          sleep 5
          ssh -i /tmp/ssh_key -o StrictHostKeyChecking=no -J $JUMP_HOST $BACKEND_HOST \
            "curl -sf -o /dev/null -w '%{http_code}' http://localhost:8000/health || echo 'No health endpoint'"

      - name: Cleanup old backups (keep last 5)
        if: always()
        run: |
          ssh -i /tmp/ssh_key -o StrictHostKeyChecking=no -J $JUMP_HOST $BACKEND_HOST \
            "ls -td ${REMOTE_PATH}.backup.* 2>/dev/null | tail -n +6 | xargs -r rm -rf || true"
